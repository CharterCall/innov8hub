<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Matches logo-photo palette: vivid teal-cyan → electric blue -->
    <linearGradient id="g" x1="16" y1="2" x2="16" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00D4FF"/>
      <stop offset="45%"  stop-color="#0088FF"/>
      <stop offset="100%" stop-color="#004ECC"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-60%" y="-50%" width="220%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Soft outer aura -->
    <filter id="aura" x="-100%" y="-80%" width="300%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Dark navy background matching logo-photo background -->
  <rect width="32" height="32" rx="7" fill="#071428"/>

  <!-- Outer aura glow -->
  <path d="M16,17.5 C5,15 5,2.5 16,2.5 C27,2.5 27,15 16,17.5"
        fill="none" stroke="#0099FF" stroke-width="7" filter="url(#aura)" opacity="0.5"/>
  <path d="M16,14.5 C27,17 27,29.5 16,29.5 C5,29.5 5,17 16,14.5"
        fill="none" stroke="#0066CC" stroke-width="7" filter="url(#aura)" opacity="0.4"/>

  <!-- Bottom loop (rear) -->
  <path d="M16,14.5 C27,17 27,29.5 16,29.5 C5,29.5 5,17 16,14.5"
        stroke="url(#g)" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Top loop (front, with glow) -->
  <path d="M16,17.5 C5,15 5,2.5 16,2.5 C27,2.5 27,15 16,17.5"
        stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Inner highlight on top loop -->
  <path d="M16,17.5 C5,15 5,2.5 16,2.5 C27,2.5 27,15 16,17.5"
        stroke="#AAEEFF" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
</svg>
